<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" media="print" href="print.css">
  <title>figures</title>
  <style>
  </style>
</head>

<body>
  <figure>
    <figcaption>Figuur 1. het aanbrengen van een deklaag hoogglans op voorgefreesde panelen.</figcaption>
    <svg style="--conveyor-speed: 0.4s;--conveyor-wheel-speed: 1.6s;--blade-angle: 70deg;" viewBox="4 0 242 105" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    <marker markerUnits="strokeWidth" id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path stroke="context-stroke" fill="context-stroke" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <polyline id="blade" stroke-width=".5" points="0,0 12,0 10,.5 8,.5 8,1 5,2 5,3 0,3 0,0" class="stroke-primary"/>
    <path id="liquid" stroke="none" d="M 8 11 Q 14 18 12 25 Q 14 18 18 13 Q 14 14 10 12 Q 4 6 8 10"/>
    <path id="wave" d="M0 -1 c 200 -0.5, 400 -0.5, 600 0 c 200 0.5, 400 0.5, 600 0 c 200 -0.5, 400 -0.5, 600 0 c 200 0.5, 400 0.5, 600 0 v2c -200 -0.5, -400 -0.5, -600 0 c -200 0.5, -400 0.5, -600 0 c -200 -0.5, -400 -0.5, -600 0 c -200 0.5, -400 0.5, -600 0z"/>
    <mask id="liquidMask">
    <rect fill="white" x="0" y="0" width="40" height="40"/>
    <circle stroke="black" stroke-width="1" fill="black" cx="32" cy="27.5" r="20"/>
    <circle stroke="black" stroke-width="1" fill="black" cx="0" cy="20" r="12" />
    </mask>
    <clipPath id="waveClip">
    <circle cx="0" cy="0" r="4">
    <animate attributeName="cx" from="0" to="2300" dur="2s" repeatCount="indefinite"/>
    </circle>
    </clipPath>
    </defs>
    <rect class="fill-primary" stroke="none" x="0" y="0" width="100%" height="100%" />
    <!-- Roller conveyor -->
    <circle class="stroke-primary fill-primary" cx="10"  cy="65" r="5" stroke-width="1" />
    <circle class="stroke-primary fill-primary" cx="30"  cy="65" r="5" stroke-width="1" />
    <circle class="stroke-primary fill-primary" cx="220" cy="65" r="5" stroke-width="1" />
    <circle class="stroke-primary fill-primary" cx="240" cy="65" r="5" stroke-width="1" />
    <!-- belt and backing rollers -->
    <circle class="stroke-primary fill-primary" cx="50"  cy="70" r="10" stroke-width="1" />
    <circle class="stroke-primary fill-primary" cx="200" cy="70" r="10" stroke-width="1" />
    <circle class="stroke-primary fill-primary" cx="102" cy="80" r="20" stroke-width="1" />
    <circle class="stroke-primary fill-primary" cx="148" cy="80" r="20" stroke-width="1" />
    <g transform="translate(102 80)"><path class="conveyor-wheel stroke-primary-gray" d="M-10 0 A10 10 0 1 1 0 10" marker-end="url(#arrow)"/></g>
    <g transform="translate(148 80)"><path class="conveyor-wheel stroke-primary-gray" d="M-10 0 A10 10 0 1 1 0 10" marker-end="url(#arrow)"/></g>
    <!-- conveyor -->
    <path class="stroke-primary-gray" fill="none" d="M50 60 L 200 60 A10 10 0 0 1 203 79.5 L156 99 Q153 100 150 100 L100 100 Q97 100 94 99 L47 79.5A10 10 0 0 1 50 60Z"/>
    <path class="conveyor stroke-primary"         d="M50 60 L 200 60 A10 10 0 0 1 203 79.5 L156 99 Q153 100 150 100 L100 100 Q97 100 94 99 L47 79.5A10 10 0 0 1 50 60Z"/>
    <!-- application roller -->
    <circle class="stroke-primary-gray fill-gray" cx="102" cy="37.5" r="20" stroke-width="1" />
    <g transform="translate(102 37.5)"><path class="roller stroke-primary" d="M0 -10 A10 10 0 1 0 10 0" fill="none" stroke-width="1" marker-end="url(#arrow)"/></g>
    <!-- doctor roller -->
    <circle cx="70" cy="30" r="12" stroke-width="1" class="stroke-primary-gray fill-gray" />
    <line class="stroke-primary" stroke-width="1" x1="15" y1="50" x2="35" y2="50" marker-end="url(#arrow)"/>
    <!-- doctor roller arrow -->
    <g transform="translate(70 30)">
      <path class="stroke-primary" d="M0 -6 A6 6 0 1 0 6 0" fill="none" stroke-width=".8" marker-start="url(#arrow)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" additive="sum" repeatCount="indefinite" />
      </path>
    </g>
    <!-- blades -->
    <g transform="translate(75, 10)">

        <use href="#blade" class="blade-left stroke-primary fill-primary"/>
    </g>
    <g transform="translate(94, 10) scale(1 -1)">
      <use href="#blade" class="blade-right stroke-primary fill-primary"/>
    </g>
    <!-- liquid -->
    <use mask="url(#liquidMask)" class="fill-blue" transform="translate(70 10)" href="#liquid"/>
    <path fill="none" class="stroke-blue" stroke-width="0.6" d="M81.5 38a20.5 20.5 0 0 0 20 20"/>
    <path fill="none" class="stroke-blue" stroke-width="0.6" d="M81.5 38a20.5 20.5 0 1 1 20 20">
      <!-- dur = calc(var(--conveyor-speed) * 10)  -->
      <animate attributeName="visibility" from="visible" to="hidden" begin="2.6s" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- pump -->
    <use href="#wave" clip-path="url(#waveClip)" transform="translate(83 21) rotate(90 0 0)" x="0" y="0" class="fill-blue">
      <animate attributeName="x" from="0" to="-2300" dur="2s" repeatCount="indefinite"/>
    </use>
    <path class="stroke-primary fill-primary" stroke-width="0.5" d="M81.5 13a1.5 1.5 0 0 1 3 0v4h-3z"/>
    <!-- panel -->
    <line class="panel stroke-primary-gray" stroke-width="0.4" x1="1" y1="58.3" x2="297" y2="58.3"/>
    <line class="panel stroke-primary-gray" stroke-width="0.8" x1="0" y1="58.6" x2="296" y2="58.6"/>
    <line class="panel stroke-primary-gray" stroke-width="0.5" x1="2" y1="59.1" x2="298" y2="59.1"/>
    <!-- style="animation-delay: 1.16s"  -->
    <!-- style="animation-delay: 1.75s"  -->
    <line class="coating first-layer stroke-blue" stroke-width="0.6" x1="102" y1="58" x2="298" y2="58"/> 
    <line class="coating second-layer stroke-blue" stroke-width="0.6" x1="148" y1="57.4" x2="298" y2="57.4"/>
    <!-- application reverse roller -->
    <circle class="stroke-primary-gray fill-gray" cx="148" cy="37" r="20" stroke-width="1"/>
    <g transform="translate(148 37)">
      <path class="reverseroller stroke-primary" d="M0 -10 A10 10 0 1 0 10 0" fill="none" stroke-width="1" marker-start="url(#arrow)"/>
    </g>
    <!-- reverse doctor roller -->
    <circle stroke="none" cx="180" cy="30" r="12" stroke-width="1" class="fill-gray stroke-primary-gray" />
    <!-- reverse doctor roller arrow -->
    <g transform="translate(180 30)">
      <path class="stroke-primary" d="M0 -6 A6 6 0 1 0 6 0" fill="none" stroke-width=".8" marker-start="url(#arrow)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" additive="sum" repeatCount="indefinite" />
      </path>
    </g>
    <!-- reverse liquid -->
    <use mask="url(#liquidMask)" class="fill-blue" transform="translate(180 10) scale(-1 1)" href="#liquid"/>
    <!-- reverse blades -->
    <g transform="translate(157, 10)">
      <use href="#blade" class="blade-left stroke-primary fill-primary" />
    </g>
    <g transform="translate(176, 10) scale(1 -1)">
      <use href="#blade" class="blade-right stroke-primary fill-primary" />
    </g>
    <path fill="none" class="stroke-blue" stroke-width="0.5" d="M168.5 37.5a20.5 20.5 0 0 1 -20 20"/>
    <path fill="none" class="stroke-blue" stroke-width="0.5" d="M168.5 37.5a20.5 20.5 0 1 0 -20 20">
      <!-- dur = calc(var(--conveyor-speed) * 10)  -->
      <animate attributeName="visibility" from="visible" to="hidden" begin="3.5s" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- reverse pump -->
    <use href="#wave" clip-path="url(#waveClip)" transform="translate(166 21) rotate(90 0 0)" x="0" y="0" class="fill-blue">
      <animate attributeName="x" from="0" to="-2300" dur="2s" repeatCount="indefinite"/>
    </use>
    <path class="stroke-primary fill-primary" stroke-width="0.5" d="M164.5 13a1.5 1.5 0 0 1 3 0v4h-3z"/>
    </svg>
  </figure>
</body>

</html>
